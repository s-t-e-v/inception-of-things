apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-app-sbandaog
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/s-t-e-v/argocd-app-sbandaog
    targetRevision: HEAD
    path: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true