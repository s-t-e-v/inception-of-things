apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitlab-postgres
  namespace: gitlab

spec:
  instances: 1

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 768Mi

  enableSuperuserAccess: true
  superuserSecret:
    name: pgsql-secrets

  storage:
    size: 2Gi
