garage:
  replicationFactor: 1

deployment:
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 384Mi

persistence:
  meta:
    storageClass: "local-path"
    size: 100Mi
  data:
    storageClass: "local-path"
    size: 1Gi

ingress:
  s3:
    api:
      enabled: false
