apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-app-sbandaog
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://git@gitlab-gitlab-shell.gitlab.svc.cluster.local:2222/root/argocd-app-sbandaog.git
    targetRevision: HEAD
    path: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
